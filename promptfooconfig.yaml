# LEVEL 3 (BONUS) – LLM-AS-JUDGE WITH PROMPTFOO
# Some qualities can't be checked with "contains": is the answer faithful to the retrieved chunks?
# Is the refusal polite and free of invented facts? Here a second LLM (the Azure model from your
# portal) grades the answers of your Dify chatbot.
#
# Run:   npm run test:judge      then   npm run judge:view   (opens a side-by-side results table)
# Needs: DIFY_BASE_URL, DIFY_APP_KEY, AZURE_API_KEY, AZURE_API_HOST, AZURE_DEPLOYMENT in .env

description: Dify RAG chatbot – LLM-as-judge

prompts:
  - '{{query}}'

providers:
  - id: https
    label: dify-chatbot
    config:
      url: '{{ env.DIFY_BASE_URL }}/chat-messages'
      method: POST
      headers:
        Content-Type: application/json
        Authorization: 'Bearer {{ env.DIFY_APP_KEY }}'
      body:
        inputs: {}
        query: '{{prompt}}'
        response_mode: blocking
        user: qa-e2e-judge
      # Keep the whole Dify response: we need both the answer and the cited chunks
      transformResponse: json

defaultTest:
  options:
    # What the checks look at: the answer text...
    transform: output.answer
    # The judge LLM (Azure OpenAI, values from the portal)
    provider:
      id: 'azure:chat:{{ env.AZURE_DEPLOYMENT }}'
      config:
        apiHost: '{{ env.AZURE_API_HOST }}'
  assert:
    - type: latency
      threshold: 30000

tests:
  - description: Grounded answer is faithful to the retrieved documents
    vars:
      query: Which issue is about the default Jackson configuration erroring out on unknown properties?
    assert:
      - type: icontains
        value: REST-266
      - type: context-faithfulness
        threshold: 0.7
        # ...and the context the answer must be faithful to: the chunks Dify retrieved
        contextTransform: 'output.metadata.retriever_resources.map(r => r.content).join("\n\n")'

  - description: Factual detail is correct
    vars:
      query: Who reported REST-266?
    assert:
      - type: icontains
        value: Luis Miranda
      - type: llm-rubric
        value: States that REST-266 was reported by Luis Miranda and adds no facts that are not about REST-266.

  - description: Out-of-scope question is refused
    vars:
      query: Why is the sky blue?
    assert:
      - type: regex
        value: "I[’']m sorry"
      - type: llm-rubric
        value: Politely declines because the project documentation has no answer. Does NOT explain why the sky is blue.

  - description: Unknown issue is not invented
    vars:
      query: Summarize REST-999
    assert:
      - type: llm-rubric
        value: Says the issue cannot be found. Does NOT describe any content for REST-999.

  # A real finding: this question from Exercise 3 is sometimes answered with the wrong issue (REST-430).
  # Retrieval ranks REST-266 first, so the problem is in the generation step. Run it a few times!
  - description: 'Known finding – Exercise 3 acceptance question'
    vars:
      query: Which issue creates a backward-compatibility risk when unknown JSON properties are accepted?
    assert:
      - type: icontains
        value: REST-266
      - type: context-faithfulness
        threshold: 0.7
        contextTransform: 'output.metadata.retriever_resources.map(r => r.content).join("\n\n")'
